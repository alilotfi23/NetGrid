name: Nightly

# The fast checks (typecheck, lint, tests) run on every push in ci.yml;
# this workflow runs only the slower next build, which catches route/page
# compile errors and dependency drift without blocking push CI.
on:
  schedule:
    # Random minute (17) to avoid the top-of-hour surge of scheduled runs.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  frontend-build:
    name: Frontend — next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The backend is not needed — every page is force-dynamic and fetches
      # at request time, so the build is purely a compile check.
      - name: Build
        run: npm run build
