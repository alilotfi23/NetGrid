name: Nightly

# The fast checks (typecheck, lint, tests) run on every push in ci.yml;
# this workflow runs the slower checks without blocking push CI: the next
# build (catches route/page compile errors and dependency drift) and the
# full-stack e2e smoke test (builds every image and proves the compose stack
# interoperates end to end).
on:
  schedule:
    # Random minute (17) to avoid the top-of-hour surge of scheduled runs.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  frontend-build:
    name: Frontend — next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The backend is not needed — every page is force-dynamic and fetches
      # at request time, so the build is purely a compile check.
      - name: Build
        run: npm run build

  full-stack-smoke:
    name: Full-stack e2e smoke (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds all five images and proves they interoperate: the backend
      # auto-migrates on startup, a subscriber created through the API can
      # authenticate through FreeRADIUS (and is rejected when suspended),
      # the frontend serves pages that reach the API through the compose
      # network, and the API smoke scripts pass against the compose backend.
      - name: Full-stack smoke test
        run: ./scripts/smoke_e2e.sh

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
