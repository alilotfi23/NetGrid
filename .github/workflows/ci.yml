name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — ruff, mypy, pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Same initdb scripts as local `docker compose up`: radius schema +
      # hardening indexes + the netgrid_test database the test suite runs
      # against (never SQLite — see CLAUDE.md pinned decisions).
      - name: Start Postgres + Redis (compose)
        working-directory: .
        run: docker compose up -d --wait postgres redis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Mypy typecheck
        run: mypy app

      # RADIUS integration tests run in the separate, slower `radius` job.
      - name: Pytest
        run: pytest -q --ignore=tests/radius

  smoke:
    name: API smoke tests (invoices + sessions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres + Redis (compose)
        working-directory: .
        run: docker compose up -d --wait postgres redis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: pip install -e ".[dev]"

      # The seed migrations create the superadmin/roles the smoke scripts log
      # in as — without `alembic upgrade head` there is no login to test.
      - name: Migrate database (seeds superadmin + roles)
        run: alembic upgrade head

      - name: Start backend (uvicorn, background)
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 \
            > /tmp/netgrid-uvicorn.log 2>&1 &
          echo "$!" > /tmp/netgrid-uvicorn.pid

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then
              echo "backend healthy after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy"
          tail -50 /tmp/netgrid-uvicorn.log
          exit 1

      # All three scripts are self-cleaning (they delete/deactivate what they
      # seed), so they can run back to back against the same database.
      - name: Smoke — invoices API
        run: ./scripts/smoke_invoices.sh

      - name: Smoke — subscribers + plans API
        run: ./scripts/smoke_subscribers_plans.sh

      - name: Smoke — sessions API
        run: ./scripts/smoke_sessions.sh

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/netgrid-uvicorn.log

  radius:
    name: RADIUS integration (slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres + FreeRADIUS (compose)
        run: docker compose up -d --wait postgres freeradius

      # Scripted radtest check proving the full path: RADIUS packet ->
      # rlm_sql -> postgres -> radpostauth write back. radtest exits non-zero
      # on Access-Reject, which is the expected outcome for an unknown user.
      - name: Smoke — auth round-trip through rlm_sql to Postgres
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            OUT="$(docker compose exec -T freeradius radtest baduser badpass 127.0.0.1 0 testing123 2>&1 || true)"
            if echo "$OUT" | grep -q "Received"; then
              break
            fi
            sleep 2
          done
          echo "$OUT"
          echo "$OUT" | grep -q "Access-Reject"
          ROWS="$(docker compose exec -T postgres psql -U netgrid -d netgrid -tAc \
            "SELECT count(*) FROM radpostauth WHERE username='baduser' AND reply='Access-Reject'")"
          echo "radpostauth rows for baduser: $ROWS"
          test "$ROWS" -ge 1

      # Scripted radtest checks for the Phase 11 lockout policy — the lockout
      # lifecycle, successful-auths-don't-count, unknown users, and hostile
      # User-Names, all asserted against radpostauth via psql.
      - name: Scripted RADIUS tests (tests/radius)
        run: |
          cd backend
          pip install -e ".[dev]"
          pytest tests/radius -q
