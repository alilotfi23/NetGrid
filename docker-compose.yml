name: netgrid

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netgrid
      POSTGRES_PASSWORD: netgrid
      POSTGRES_DB: netgrid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./freeradius/raddb/mods-config/sql/main/postgresql/schema.sql:/docker-entrypoint-initdb.d/10-radius-schema.sql:ro
      - ./freeradius/raddb/mods-config/sql/main/postgresql/indexes.sql:/docker-entrypoint-initdb.d/20-radius-indexes.sql:ro
      - ./docker/postgres/30-create-test-db.sql:/docker-entrypoint-initdb.d/30-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netgrid -d netgrid"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [netgrid]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [netgrid]

  freeradius:
    build: ./freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [netgrid]

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://netgrid:netgrid@postgres:5432/netgrid
      REDIS_URL: redis://redis:6379/0
    # Migrations run before uvicorn on every start (idempotent), so a fresh
    # `docker compose up` is fully provisioned with no host-side step. The
    # alembic mounts keep dev containers in sync with local migration files.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    networks: [netgrid]

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks: [netgrid]

  sim-nas:
    # Simulated NAS: sends periodic RADIUS Access-Requests to FreeRADIUS,
    # proving the full auth path (NAS → FreeRADIUS → SQL → radcheck).
    # Register this device as a NAS in NetGrid after startup:
    #   bash scripts/setup-mikrotik-nas.sh
    build: ./docker/sim-nas
    environment:
      RADIUS_HOST: freeradius
      RADIUS_SECRET: netgrid_radius_secret
      NAS_USERNAME: demo-user
      NAS_PASSWORD: demo-pass
      NAS_INTERVAL: "30"
      NAS_IP: 10.0.0.99
      PYTHONUNBUFFERED: "1"
    depends_on:
      freeradius:
        condition: service_started
    networks: [netgrid]
    # --- MikroTik RouterOS (Linux hosts with /dev/net/tun only) ---
    # Uncomment the block below and remove sim-nas above for a real
    # RouterOS container.  Requires: Linux Docker, /dev/net/tun, NET_ADMIN.
    # image: cnsoluciones/mikrotik:latest
    # privileged: true
    # devices: ["/dev/net/tun:/dev/net/tun"]
    # cap_add: [NET_ADMIN]
    # ports: ["8728:8728", "8729:8729", "8080:80"]
    # volumes: ["./docker/mikrotik/autorun.rsc:/rw/disk/autorun.rsc:ro"]

networks:
  netgrid:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
